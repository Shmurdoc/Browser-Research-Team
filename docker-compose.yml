# ============================================================
# Design Pattern Multiverse — Docker Compose
# ============================================================
# Run with: docker compose up -d
# Web UI: http://localhost:3000
# Health: http://localhost:3000/health
# ============================================================

services:
  dpm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design-pattern-multiverse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DPM_WEB_PORT=3000
      - DPM_WEB_HOST=0.0.0.0
      - DPM_STORAGE_DIR=/app/patterns
      - DPM_RATE_LIMIT_PER_MINUTE=100
      # Optional: Set these for production
      # - DPM_WEB_KEY=your-api-key-here
      # - OPENAI_API_KEY=sk-...
      # - DPM_ALLOWED_ORIGINS=https://yourdomain.com
    volumes:
      - dpm-data:/app/patterns
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

volumes:
  dpm-data:
    driver: local
