# ============================================================
# Design Pattern Multiverse — Fly.io Deployment Config
# ============================================================
# Deploy: fly launch && fly deploy
# Docs: https://fly.io/docs/reference/configuration/
# ============================================================

app = 'design-pattern-multiverse'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'production'

[env]
  NODE_ENV = 'production'
  PLAYWRIGHT_CHROMIUM_PATH = '/usr/bin/chromium'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
  PLAYWRIGHT_BROWSERS_PATH = '0'
  DPM_STORAGE_DIR = '/data/patterns'
  DPM_LOG_DIR = '/data/logs'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/ready'

[mounts]
  source = 'dpm_data'
  destination = '/data'

[deploy]
  strategy = 'rolling'
  max_unavailable = 0
